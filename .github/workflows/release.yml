name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build XPI
        shell: pwsh
        run: ./build.ps1
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content ./manifest.json -Raw | ConvertFrom-Json
          "version=$($manifest.version)" >> $env:GITHUB_OUTPUT
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Zotero Duplicate Cleaner v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            zotero-dedup-plugin-${{ steps.version.outputs.version }}.xpi
            zotero-dedup-plugin.xpi
